<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Dépliante Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'BubbleFont';
      src: url('../BubbleFont-subset.woff2') format('woff2');
      font-display: block;
    }
    
    :root {
      --primary: #1E293B; /* Deep slate */
      --accent: #D4AF37; /* Gold */
      --font-body: 'Outfit', sans-serif;
      --font-title: 'Playfair Display', serif;
      --fs-scale: 1;
      
      --paper-color: #FDFBF7;
      --cover-color: #0F172A;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-body);
      background-size: cover;
      background-position: center;
      background-color: #000; /* Fallback */
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      perspective: 1800px;
    }

    /* Ambient lighting on background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .book-wrapper {
      position: relative;
      width: 340px;
      height: 480px;
      z-index: 10;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      /* Initial slight angle for 3D feel */
      transform: rotateX(5deg) rotateY(-5deg);
    }
    
    .book-wrapper:hover {
      transform: rotateX(2deg) rotateY(0deg) scale(1.02);
    }

    .book-wrapper.open {
      transform: translateX(170px) rotateX(2deg) rotateY(0deg);
    }

    /* Spine / shadow of the whole book */
    .book-wrapper::after {
      content: '';
      position: absolute;
      top: 2%; left: -10px; width: 20px; height: 96%;
      background: rgba(0,0,0,0.5);
      filter: blur(15px);
      z-index: -1;
      transform: translateZ(-20px);
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      border-radius: 6px 16px 16px 6px;
    }

    /* ── Inside Right Page ── */
    .page-right {
      z-index: 1;
      background: var(--paper-color);
      box-shadow: 
        inset 10px 0 20px rgba(0,0,0,0.05),
        inset -1px 0 2px rgba(255,255,255,0.8),
        15px 15px 40px rgba(0,0,0,0.3);
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
      /* subtle paper texture */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    }

    .inside-border {
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      pointer-events: none;
    }

    .title {
      font-family: var(--font-title);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      margin-bottom: 25px;
      line-height: 1.2;
    }

    .message {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #334155;
      flex-grow: 1;
      white-space: pre-wrap;
      font-weight: 300;
      position: relative;
      z-index: 2;
    }

    .sender {
      font-family: var(--font-title);
      font-size: 1.2rem;
      color: var(--accent);
      text-align: right;
      font-style: italic;
      margin-top: 30px;
    }

    /* ── Cover Page Container (rotates) ── */
    .page-cover-container {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-origin: left;
      transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      z-index: 20;
    }

    .book-wrapper.open .page-cover-container {
      transform: rotateY(-170deg);
    }

    /* ── Cover Front ── */
    .page-cover-front {
      z-index: 10;
      background: var(--cover-color);
      /* Rich gradient */
      background-image: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
      color: #fff;
      backface-visibility: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 6px 16px 16px 6px;
      box-shadow: 
        inset 2px 0 5px rgba(255,255,255,0.2), /* Spine highlight */
        inset -5px 0 10px rgba(0,0,0,0.2), /* Edge shadow */
        5px 10px 25px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    /* Lighting specular effect on cover */
    .page-cover-front::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%);
      pointer-events: none;
    }

    /* Decorative gold frame on cover */
    .cover-frame {
      position: absolute;
      inset: 15px;
      border: 2px solid var(--accent);
      border-radius: 8px;
      opacity: 0.8;
      pointer-events: none;
    }
    .cover-frame::before, .cover-frame::after {
      content: ''; position: absolute; width: 10px; height: 10px; border: 2px solid var(--accent);
    }
    .cover-frame::before { top: -6px; left: -6px; border-right: none; border-bottom: none; }
    .cover-frame::after { bottom: -6px; right: -6px; border-left: none; border-top: none; }

    .recipient {
      font-family: 'BubbleFont', sans-serif;
      font-size: 3.5rem;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.1;
      color: var(--accent);
      text-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2;
      padding: 0 20px;
    }

    .hint {
      position: absolute;
      bottom: 30px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      z-index: 2;
      font-weight: 500;
    }

    /* ── Cover Back (Inside Left Page) ── */
    .page-cover-back {
      z-index: 9;
      transform: rotateY(-180deg);
      background: var(--paper-color);
      border-radius: 16px 6px 6px 16px; /* inverted radius */
      backface-visibility: hidden;
      box-shadow: inset -10px 0 20px rgba(0,0,0,0.08);
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .page-cover-back::after {
      /* Crease shadow */
      content: '';
      position: absolute;
      top: 0; right: 0; width: 30px; height: 100%;
      background: linear-gradient(to left, rgba(0,0,0,0.1), transparent);
    }

    /* Small decorative element on left page */
    .stamp {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1px solid rgba(212, 175, 55, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      color: rgba(212, 175, 55, 0.6);
      font-size: 2rem;
      transform: rotate(-15deg);
    }

    #tsparticles-confetti {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="tsparticles-confetti"></div>

  <div class="book-wrapper" id="booklet">
    <!-- Right Page (Inside) -->
    <div class="page page-right">
      <div class="inside-border"></div>
      <div class="title" id="inside-title">Titre</div>
      <div class="message" id="inside-message">Message</div>
      <div class="sender" id="inside-sender">De: </div>
    </div>
    
    <!-- Cover (Rotates) -->
    <div class="page-cover-container" id="cover">
      <!-- Outside Cover -->
      <div class="page page-cover-front" id="cover-bg" onclick="toggleBook()">
        <div class="cover-frame"></div>
        <div class="recipient" id="cover-name">Prénom</div>
        <div class="hint">Ouvrir la carte</div>
      </div>
      <!-- Inside Left Cover -->
      <div class="page page-cover-back" onclick="toggleBook()">
        <div class="stamp">✨</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tsparticles-confetti@2.11.0/tsparticles.confetti.bundle.min.js"></script>
  <script>
    let isOpen = false;
    function toggleBook() {
      const book = document.getElementById('booklet');
      isOpen = !isOpen;
      if (isOpen) {
        book.classList.add('open');
        setTimeout(() => {
          confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#D4AF37', '#1E293B', '#ffffff'],
            disableForReducedMotion: true
          });
        }, 500);
      } else {
        book.classList.remove('open');
      }
    }

    function renderData(data, style) {
      if (style) {
        if (style.primaryColor) {
          document.documentElement.style.setProperty('--cover-color', style.primaryColor);
        }
        if (style.accentColor) {
          document.documentElement.style.setProperty('--accent', style.accentColor);
        }
        if (style.backgroundImg) {
          document.body.style.backgroundImage = `url(${style.backgroundImg})`;
        }
      }
      if (data) {
        if (data.recipient) document.getElementById('cover-name').textContent = data.recipient;
        if (data.titleName) document.getElementById('inside-title').textContent = data.titleName;
        if (data.message) document.getElementById('inside-message').textContent = data.message;
        if (data.sender) document.getElementById('inside-sender').textContent = data.sender;
      }
    }

    if (window.__WW_DATA__ || window.__WW_STYLE__) {
      renderData(window.__WW_DATA__, window.__WW_STYLE__);
    }

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'WW_UPDATE') return;
      renderData(e.data.data, e.data.style);
    });
  </script>
</body>
</html>
