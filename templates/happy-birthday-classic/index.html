<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Sriracha&family=Dancing+Script:wght@400;700&family=Lato:ital,wght@1,300&family=Inter:wght@400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       ROOT + RESET
    ══════════════════════════════════════════════════════════════════════ */
    :root {
      --color-pink: #feecea;
      --color-white: #fff;
      --color-black: #333;
      --color-text-pink: #FF7882;
      --color-heart: #FF7882;
      --color-bg-letter: #fff8e4;
      --color-border: #DACCBF;
      --loader-bg: #ee9ca7;
      --primary: #FF7882;
      --accent: #8B0000;
      --fs-scale: 1;
    }

    * { padding: 0; margin: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-size: 16px;
      font-family: 'Sriracha', cursive;
      background: var(--color-pink);
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ══════════════════════════════════════════════════════════════════════
       SCENES  (like notre-film pattern)
    ══════════════════════════════════════════════════════════════════════ */
    .scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .scene.active { visibility: visible; opacity: 1; }

    /* ══════════════════════════════════════════════════════════════════════
       INTRO  CAKE LOADER
    ══════════════════════════════════════════════════════════════════════ */
    #loader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      background: var(--loader-bg);
      overflow: hidden;
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease-out;
      z-index: 9999;
      transform: translateY(0);
      opacity: 1;
    }
    #loader.out {
      transform: translateY(-100vh);
      opacity: 0;
      visibility: hidden;
    }
    .full-screen-deco {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%; z-index: 1;
      pointer-events: none;
    }
    .deco-shape { opacity: 0; animation-fill-mode: forwards; transform-origin: center; }
    .deco-shape.big-circle {
      opacity: 0.5;
      animation: slowFloat 20s ease-in-out infinite alternate,
                 moveAcross 35s linear infinite;
      animation-delay: 1s;
    }
    .deco-shape.small-ring {
      opacity: 0.6;
      animation: rotateZ 30s linear infinite reverse,
                 gentleDrift 25s ease-in-out infinite;
      animation-delay: 5s;
    }
    .particle-red-1  { animation: floatAndFade 18s ease-in-out infinite alternate, rotateZ 15s linear infinite; opacity: 0.7; }
    .particle-white-1{ animation: driftUp 22s ease-in-out infinite, sway 10s ease-in-out infinite alternate; opacity: 0.6; }
    .particle-pink-1 { animation: floatAndScale 25s linear infinite, wiggle 7s ease-in-out infinite alternate; opacity: 0.5; }
    .particle-red-2  { animation: driftDiagonal 20s ease-in-out infinite alternate, pulseOpacity 3s ease-in-out infinite alternate; opacity: 0.8; }
    .particle-white-2{ animation: floatAndFade 23s ease-in-out infinite reverse, rotateZ 18s linear infinite reverse; opacity: 0.7; }
    .particle-pink-2 { animation: driftUp 27s ease-in-out infinite reverse, sway 12s ease-in-out infinite alternate; opacity: 0.4; }
    .particle-dot-1, .particle-dot-2, .particle-dot-3, .particle-dot-4 { animation: smallSparkle 4s ease-out infinite; }
    .particle-dot-1 { animation-delay: 1s; opacity: 0.9; }
    .particle-dot-2 { animation-delay: 2.5s; opacity: 0.8; }
    .particle-dot-3 { animation-delay: 0.5s; opacity: 0.7; }
    .particle-dot-4 { animation-delay: 3.2s; opacity: 0.95; }

    @keyframes slowFloat  { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }
    @keyframes moveAcross { from{transform:translateX(-10vw)} to{transform:translateX(10vw)} }
    @keyframes gentleDrift{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }
    @keyframes floatAndFade { 0%{transform:translateY(0);opacity:0.5} 50%{transform:translateY(-15vh);opacity:1} 100%{transform:translateY(0);opacity:0.5} }
    @keyframes rotateZ { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes driftUp { 0%{transform:translateY(0)} 100%{transform:translateY(-20vh)} }
    @keyframes sway { 0%{transform:translateX(0)} 50%{transform:translateX(10vw)} 100%{transform:translateX(0)} }
    @keyframes floatAndScale { 0%{transform:translateY(0) scale(1)} 50%{transform:translateY(-10vh) scale(1.1)} 100%{transform:translateY(0) scale(1)} }
    @keyframes wiggle { 0%,100%{transform:translate(0,0)} 25%{transform:translate(2vw,1vh) rotate(5deg)} 50%{transform:translate(-1vw,-2vh) rotate(-3deg)} 75%{transform:translate(3vw,0.5vh) rotate(2deg)} }
    @keyframes driftDiagonal { 0%{transform:translate(0,0)} 100%{transform:translate(10vw,-15vh)} }
    @keyframes pulseOpacity { 0%{opacity:0.6} 50%{opacity:1} 100%{opacity:0.6} }
    @keyframes smallSparkle { 0%{opacity:0;transform:scale(.5)} 50%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.5)} }

    #CakeWrapper { width: 400px; margin: 0 auto; position: relative; top: 15%; }
    @media (max-width: 658px) { #CakeWrapper { width: auto; } }
    #cake { display: block; position: relative; margin: -10em auto 0 auto; }
    .velas {
      background: #fff; border-radius: 10px; position: absolute;
      top: 228px; left: 50%; margin-left: -2.4px; margin-top: -8.33px;
      width: 5px; height: 35px;
      transform: translateY(-300px);
      animation: candleIn 500ms 6s ease-out forwards;
    }
    .velas:after, .velas:before {
      background: rgba(255,0,0,0.4); content: '';
      position: absolute; width: 100%; height: 2.22px;
    }
    .velas:after  { top: 25%; left: 0; }
    .velas:before { top: 45%; left: 0; }
    .fuego {
      border-radius: 100%; position: absolute;
      top: -20px; left: 50%; margin-left: -2.6px;
      width: 6.67px; height: 18px;
    }
    .fuego:nth-child(1) { animation: fuego 2s   6.5s infinite; }
    .fuego:nth-child(2) { animation: fuego 1.5s 6.5s infinite; }
    .fuego:nth-child(3) { animation: fuego 1s   6.5s infinite; }
    .fuego:nth-child(4) { animation: fuego 0.5s 6.5s infinite; }
    .fuego:nth-child(5) { animation: fuego 0.2s 6.5s infinite; }
    @keyframes fuego {
      0%,100%{ background:rgba(254,248,97,.5); box-shadow:0 0 40px 10px rgba(248,233,209,.2); transform:translateY(0) scale(1); }
      50%    { background:rgba(255,50,0,.1);   box-shadow:0 0 40px 20px rgba(248,233,209,.2); transform:translateY(-20px) scale(0); }
    }
    @keyframes candleIn { to { transform: translateY(0); } }
    .cakeText {
      position: fixed; top: 66%; left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0; visibility: hidden;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      z-index: 10002;
      animation: textAppear 1.2s cubic-bezier(0.23,1,0.32,1) 6.8s forwards;
    }
    .cakeText-title {
      font-size: 45px; line-height: 1; color: #8B0000;
      font-weight: 700; text-shadow: 0 0 10px rgba(255,105,180,.5);
    }
    .cakeText-name {
      font-family: 'Great Vibes', 'Dancing Script', cursive;
      font-size: 3.5em; font-weight: 500; color: #961212;
      opacity: 0;
      animation: ribbonFadeIn 1s cubic-bezier(0.65,.05,.36,1) 7.4s forwards;
      text-shadow: 0 0 10px rgba(255,105,180,.5);
      position: relative;
    }
    .cakeText-kitty-bow {
      position: absolute; top: 8px; right: 20%;
      width: 40px; height: 26px;
      opacity: 0;
      transform: rotate(46deg);
      animation: bowWiggle 1s ease-in-out infinite alternate 7.4s forwards;
    }
    @keyframes textAppear { 0%{opacity:0;visibility:hidden;transform:translate(-50%,-40%)} 100%{opacity:1;visibility:visible;transform:translate(-50%,-50%)} }
    @keyframes ribbonFadeIn { 0%{opacity:0;transform:translateX(-70px) scale(.8);filter:blur(5px)} 100%{opacity:1;transform:translateX(0) scale(1);filter:blur(0)} }
    @keyframes bowWiggle { 0%{transform:rotate(0);opacity:1} 25%{transform:rotate(10deg)} 50%{transform:rotate(-8deg)} 75%{transform:rotate(5deg)} 100%{transform:rotate(0);opacity:1} }
    @media (max-width: 658px) {
      .cakeText-title { font-size: 30px; width: 300px; }
      .cakeText-name  { font-size: 2.4em; }
    }

    /* ══════════════════════════════════════════════════════════════════════
       SCENE 1  HOME
    ══════════════════════════════════════════════════════════════════════ */
    #s1 {
      background-image:
        linear-gradient(0deg, transparent 24%, rgba(255,255,255,1) 25%, rgba(255,255,255,1) 26%, transparent 27%, transparent 74%, rgba(255,255,255,1) 75%, rgba(255,255,255,1) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(255,255,255,1) 25%, rgba(255,255,255,1) 26%, transparent 27%, transparent 74%, rgba(255,255,255,1) 75%, rgba(255,255,255,1) 76%, transparent 77%, transparent);
      background-size: 80px 80px;
      background-color: var(--color-pink);
    }

    .flag__birthday {
      display: flex; justify-content: space-between;
      transform: translateY(-200px);
      animation: translateYFlag 1.5s 2s forwards;
      pointer-events: none;
    }
    .flag__birthday svg { width: 350px; height: auto; }
    @media (max-width: 658px) { .flag__birthday svg { width: 220px; } }
    .flag__left  { transform: rotate(-10deg) translate(-20px, 30px); }
    .flag__right { transform: rotate(10deg)  translate(20px, 30px) scaleX(-1); }
    @keyframes translateYFlag { to { transform: translateY(-10px); } }

    .content {
      width: 100%;
      display: flex;
      padding-top: 3rem;
      position: relative;
    }
    @media (max-width: 658px) {
      .content { flex-direction: column; gap: 25px; align-items: center; padding-top: 2rem; }
    }
    .content .left, .content .right {
      position: relative;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
    }
    .content .left  { width: 40%; }
    .content .right { width: 60%; }
    @media (max-width: 658px) {
      .content .left, .content .right { width: 100%; }
    }

    .title {
      position: relative; width: 100%;
      display: flex; flex-direction: column;
      justify-content: center;
      font-family: 'Titan One', sans-serif;
      font-size: 6rem;
      line-height: 120%;
      perspective: 1000px;
    }
    @media (max-width: 658px) { .title { font-size: 3rem; letter-spacing: 8px; } }
    .title .happy, .title .birthday {
      position: relative;
      display: flex; justify-content: center;
      font-weight: bold;
      text-shadow: 4px 4px var(--color-black), -4px 4px var(--color-black),
                   4px -4px var(--color-black), -4px -4px var(--color-black),
                   4px 8px 0 var(--color-black);
    }
    .title .happy    { color: var(--color-white); }
    .title .birthday { color: var(--color-text-pink); }
    .title .happy span, .title .birthday span {
      transform: translateY(50px);
      opacity: 0; visibility: hidden;
      animation: txtTranslateY 0.5s var(--t) forwards;
    }
    @keyframes txtTranslateY { 100% { transform: translateY(0); opacity: 1; visibility: visible; } }

    .hat {
      position: absolute; right: 45px; top: -350px;
      transform: rotate(-40deg); z-index: -1;
      animation: topHat 4s 7s forwards ease;
    }
    @keyframes topHat {
      20%,30% { top: -30px; transform-origin: left; transform: rotate(-40deg); }
      35%,100%{ top: -30px; transform: rotate(0); }
    }
    @media (max-width: 658px) { .hat { right: -98px; top: -51px !important; } }
    .hat svg { width: 130px; height: auto; }

    .date__of__birth {
      display: flex; justify-content: space-around; align-items: center;
      background-color: var(--color-text-pink);
      border-radius: 50px; margin-top: 20px;
      border: 3px solid var(--color-black);
      position: relative;
      transform: translateY(-100px);
      z-index: -1; opacity: 0; visibility: hidden;
      width: 0; height: 0;
      animation: dateOfBirth 5s 9s forwards;
    }
    .date__of__birth span {
      font-family: 'Sriracha', cursive;
      font-weight: bold; font-size: 1.2rem;
      margin: 0 40px;
    }
    @keyframes dateOfBirth {
      20%,40% { width: 0; height: 0; opacity: 1; visibility: visible; }
      45%     { width: 300px; height: 0; opacity: 1; visibility: visible; }
      50%,100%{ width: 300px; height: 50px; opacity: 1; visibility: visible; }
    }

    .left .btn {
      transform: scale(0);
      animation: scaleCricle 2s 16s forwards ease-in-out;
    }
    .left .btn { display: flex; gap: 10px; }
    @media (max-width: 658px) { .left .btn { flex-direction: column; } }

    #btn__letter, #FromRexon {
      margin-top: 30px;
      background-color: var(--color-text-pink);
      padding: 5px 15px;
      border-radius: 50px;
      border: 3px solid var(--color-black);
      font-family: 'Sriracha', cursive;
      cursor: pointer;
      z-index: 2;
      transform: scale(1);
      transition: all .5s ease-in-out;
      color: var(--color-black);
      outline: none;
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 1rem;
    }
    #FromRexon { text-decoration: none; }
    #btn__letter:hover, #FromRexon:hover {
      border-color: var(--color-heart);
      background-color: var(--color-heart);
      color: #fff;
      box-shadow: rgba(0,0,0,.24) 0 3px 8px;
    }
    #btn__letter:hover svg, #FromRexon:hover svg { animation: rotateHeart 1s infinite linear; }
    #btn__letter:active { transform: scale(.7); }
    @keyframes rotateHeart { 0%,50%,100%{transform:rotate(0)} 25%{transform:rotate(12deg)} 75%{transform:rotate(-12deg)} }
    @media (max-width: 658px) { #btn__letter, #FromRexon { margin-top: 10px; width: 200px; justify-content: center; } }

    .right .box__account {
      position: relative;
      transform: translateY(700px);
      animation: topBoxImage 8s 7s forwards ease-in;
    }
    @keyframes topBoxImage { to { transform: translateY(0); } }
    .box__account .image {
      position: relative;
      width: 300px; height: 300px;
      border-radius: 50%;
      overflow: hidden;
      display: flex; align-items: center;
      border: 6px solid var(--color-black);
      background: #ddd;
    }
    .box__account .image img { width: 100%; height: 100%; object-fit: cover; }
    @media (max-width: 658px) { .box__account .image { width: 200px; height: 200px; } }
    .box__account .name {
      position: absolute;
      padding: 0 20px; bottom: -20px;
      left: 50%; transform: translateX(-50%);
      border: 3px solid var(--color-black);
      background-color: var(--color-text-pink);
      border-radius: 50px;
      font-family: 'Dancing Script', cursive;
      display: flex; align-items: center; justify-content: space-around;
    }
    .box__account .name span {
      font-weight: bold; font-size: 1.7rem;
      margin: 0 15px;
    }
    @media (max-width: 658px) { .box__account .name span { font-size: 1rem; margin: 0 8px; } }

    .fa-heart {
      color: var(--color-heart);
      filter: drop-shadow(0 0 3px var(--color-heart));
      animation: scaleHeart 1s infinite linear;
      display: inline-block;
    }
    .fa-heart svg { display: block; }
    @keyframes scaleHeart { 50% { transform: scale(1.2); } }

    .balloon_one {
      position: absolute; top: -70px; left: -70px;
      animation: balloon1 2s infinite linear;
    }
    .balloon_two {
      position: absolute; top: 170px; right: -65px; z-index: -1;
      animation: balloon2 2s infinite linear;
    }
    @keyframes balloon1 {
      0%,50%,100% { transform-origin: bottom right; transform: rotate(0); }
      25% { transform: rotate(3deg); }
      75% { transform: rotate(-3deg); }
    }
    @keyframes balloon2 {
      0%,50%,100% { transform-origin: bottom left; transform: rotate(10deg); }
      25% { transform: rotate(7deg); }
      75% { transform: rotate(13deg); }
    }
    @media (max-width: 658px) {
      .balloon_one { top: 10px; left: -60px; }
      .balloon_one svg { width: 76px; }
      .balloon_two { top: 60px; right: -50px; }
    }

    .cricle {
      position: absolute;
      top: 20px; right: 50px;
      display: flex; justify-content: center; align-items: center;
      transform: scale(0);
      animation: scaleCricle 3s 15s forwards ease-in-out;
    }
    @media (max-width: 658px) { .cricle { top: 10px; right: -30px; } }
    @keyframes scaleCricle {
      0%{transform:scale(0)} 10%{transform:scale(1.3)}
      20%{transform:scale(.7)} 30%,100%{transform:scale(1)}
    }
    .text__cricle {
      width: 100px; height: 100px;
      background-color: var(--color-text-pink);
      border-radius: 50%;
      border: 5px solid var(--color-black);
      display: flex; justify-content: center; align-items: center;
      animation: rotateCricleSpin 5s linear infinite;
    }
    @keyframes rotateCricleSpin { to { transform: rotate(360deg); } }
    .text__cricle span {
      top: 0; left: 50%; position: absolute;
      color: var(--color-black);
      transform: rotate(calc(var(--i) * 24deg));
      transform-origin: 0 45px;
      font-family: 'Sriracha', cursive;
      text-transform: uppercase;
      font-size: 0.7rem;
    }
    .cricle .fa-heart { position: absolute; transform: scale(.85); }

    .decorate_star {
      position: absolute; transform: scale(0);
      background-color: var(--color-black);
      clip-path: polygon(0 50%, 35% 35%, 50% 0, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%);
      animation: scaleCricle 3s var(--t) forwards, scaleStar 2s 16s infinite ease-in-out;
    }
    .star1 { width: 20px; height: 20px; top: 75px;  left: 300px; }
    .star2 { width: 15px; height: 20px; top: 35px;  right: 360px; }
    .star3 { width: 14px; height: 14px; top: 290px; left: 630px; }
    .star4 { width: 18px; height: 18px; bottom: 60px; left: 35px; }
    .star5 { width: 16px; height: 18px; bottom: 140px; left: 500px; }
    @media (max-width: 658px) {
      .star1 { top: 45px; left: 200px; }
      .star2 { top: 10px; right: 20px; }
      .star3 { top: 300px; left: 30px; }
    }
    @keyframes scaleStar { 25%{transform:scale(.8)} 50%{transform:scale(1.1)} }

    .decorate_flower {
      position: absolute; transform: scale(0);
      animation: scaleCricle 3s var(--t) forwards ease-in-out,
                 floatFlower 6s ease-in-out 16s infinite alternate;
    }
    .flower1 { top: 250px; left: 50px; }
    .flower2 { top: 225px; left: 540px; }
    .flower3 { top: 150px; right: 235px; }
    @media (max-width: 658px) {
      .flower1 { top: 100px; left: 30px; }
      .flower2 { top: 585px; left: 20px; }
      .flower3 { top: 320px; right: 25px; }
    }
    @keyframes floatFlower { to { transform: translateY(-12px) rotate(5deg); } }

    .smiley__icon {
      position: absolute; bottom: 180px; left: 600px;
      transform: scale(0);
      animation: scaleCricle 3s 15s forwards ease-in-out;
    }
    @media (max-width: 658px) { .smiley__icon { bottom: 250px; left: 10px; } }
    .smiley__icon svg { width: 80px; height: 80px; }

    .decorate_bottom {
      position: absolute; right: 0; bottom: -10px;
      opacity: 0;
      animation: fadeInBottom 1.5s 8s forwards;
      pointer-events: none;
    }
    @keyframes fadeInBottom { to { opacity: 1; } }
    .decorate_bottom svg { display: block; }

    /* ══════════════════════════════════════════════════════════════════════
       BOOK MODAL  (was BookCanvas)
    ══════════════════════════════════════════════════════════════════════ */
    .boxMail {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center;
      transition: all 0.5s;
      z-index: 100000;
      opacity: 0; visibility: hidden;
      pointer-events: none;
    }
    .boxMail.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .boxMail .crossAll {
      position: fixed; top: 10px; right: 10px;
      font-size: 30px; padding: 10px 25px;
      cursor: pointer; color: #fff; z-index: 999;
    }
    .boxMail .crossAll svg { width: 30px; height: 30px; }
    .boxMail-container {
      position: absolute;
      width: min(750px, 92vw);
      height: 500px;
      display: flex;
      transform: scale(0.9);
      perspective: 2000px;
      transition: transform .5s, filter .5s;
    }
    .boxMail-container:hover {
      transform: rotate(-5deg) scale(.9);
      filter: drop-shadow(0 0 10px #FF7882);
    }
    .boxMail-container:hover .card1 {
      transform: translate(-100%, -50%) rotateY(-140deg);
    }
    .card1, .card2 {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid #000;
      width: 50%; height: 100%;
      box-sizing: border-box;
    }
    .card1 {
      background: linear-gradient(135deg, #FFC0CB 0%, #F0F8FF 100%);
      color: #333;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      overflow: hidden;
      border-right: 2px solid rgba(255,255,255,.8);
      box-shadow: 5px 0 15px rgba(0,0,0,.1);
      z-index: 1;
      transform-style: preserve-3d;
      transform-origin: left;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      left: 0; transform: translate(0, -50%);
    }
    .card1 .userImg {
      position: relative;
      width: 100px; height: 100px;
      background: #fff;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #FFC0CB;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(255,192,203,.8);
      animation: floatImage 4s ease-in-out infinite;
      z-index: 3;
    }
    .card1 .userImg img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes floatImage { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .cover-text-wrapper {
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 30px;
      transform: rotate(-2deg);
      z-index: 3;
    }
    .username {
      font-family: 'Inter', sans-serif;
      font-size: 20px; font-weight: 600;
      margin-bottom: 8px; letter-spacing: 1.5px;
      text-shadow: 0 0 3px rgba(0,0,0,.1);
    }
    .cover-title {
      font-family: 'Dancing Script', cursive;
      font-size: 48px; text-transform: capitalize;
      line-height: 1.1; letter-spacing: 4px;
      color: #FF69B4;
      text-shadow: 0 0 8px rgba(255,105,180,.8), 0 0 15px rgba(255,255,255,.7);
      animation: pulseGlow 3s infinite alternate;
      text-align: center;
    }
    .cover-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 15px; margin-top: 12px;
      opacity: .9; color: #555;
    }
    @keyframes pulseGlow {
      0% { text-shadow: 0 0 5px #FF69B4, 0 0 10px #FF69B4, 0 0 15px #FFC0CB; }
      100%{ text-shadow: 0 0 10px #FF69B4, 0 0 20px #FF69B4, 0 0 30px #FFC0CB; }
    }
    .card1-sparkle {
      position: absolute; inset: 0;
      opacity: 0.2; z-index: 0;
      background: repeating-linear-gradient(45deg,
        rgba(255,255,255,.15), rgba(255,255,255,.15) 8px,
        transparent 8px, transparent 16px);
      animation: shimmer 15s linear infinite;
    }
    @keyframes shimmer { from{background-position:0 0} to{background-position:100% 100%} }
    .card1 .deco-corner {
      position: absolute; width: 60px; height: 60px;
      z-index: 1; opacity: 0.8;
      filter: drop-shadow(0 0 5px rgba(0,0,0,.2));
    }
    .top-right-star {
      top: 20px; right: 20px;
      animation: slowSpin 15s linear infinite;
    }
    .bottom-left-ring {
      bottom: 30px; left: 20px;
      animation: rotateOscillate 10s ease-in-out infinite alternate;
    }
    @keyframes slowSpin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
    @keyframes rotateOscillate { 0%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} 100%{transform:rotate(-5deg)} }

    .card2 {
      background: #f7f7f7;
      transform-style: preserve-3d;
      transform-origin: left;
      transition: all 1s cubic-bezier(0.25,0.8,0.25,1);
      box-shadow: inset 5px 0 15px rgba(0,0,0,.08);
      right: 0; left: auto; transform: translate(0, -50%);
    }
    .card2-content {
      width: 100%; height: 100%;
      background: #FF7882;
      transition: all 1s cubic-bezier(0.4,0,0.2,1);
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      color: #fff;
      border-radius: 10px;
      padding: 25px;
      display: flex; flex-direction: column;
      position: relative;
    }
    .boxMail-container:hover .card2-content {
      transform: translate(12px, 12px);
      box-shadow: 10px 10px 30px rgba(0,0,0,.4), -2px -2px 8px rgba(255,255,255,.1);
    }
    .card2 .card2-recipient {
      font-family: 'Dancing Script', cursive;
      padding-bottom: 10px; text-align: center;
      font-size: 34px; margin-bottom: 15px;
      text-shadow: 0 0 5px rgba(0,0,0,.1);
      border-bottom: 3px dashed rgba(255,255,255,.5);
    }
    .card2-message-text {
      font-family: 'Sriracha', cursive;
      padding: 10px 0;
      font-size: 18px; line-height: 1.6;
      flex-grow: 1; overflow-y: auto;
      text-shadow: 0 0 3px rgba(0,0,0,.1);
      font-style: italic;
    }
    .card2-message-text article { margin-bottom: 10px; }
    .card2-message-text::-webkit-scrollbar { width: 6px; }
    .card2-message-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,.5); border-radius: 3px; }
    .signature {
      font-family: 'Dancing Script', cursive;
      font-size: 24px; font-weight: bold;
      color: #fff; margin-top: 15px;
      text-align: right; text-shadow: 0 0 5px rgba(0,0,0,.2);
    }
    .confetti-dots {
      position: absolute; inset: 0; z-index: 0;
      pointer-events: none; opacity: 0.2;
      background:
        radial-gradient(circle at 10% 20%, #fff 2px, transparent 0),
        radial-gradient(circle at 80% 50%, rgba(255,255,255,.8) 2px, transparent 0),
        radial-gradient(circle at 50% 90%, #FF7882 1px, transparent 0),
        radial-gradient(circle at 30% 60%, #fff 1px, transparent 0),
        radial-gradient(circle at 70% 10%, #FF7882 2px, transparent 0);
      background-size: 50px 50px;
      transform: rotate(1deg);
    }
    @media (max-width: 658px) {
      .boxMail-container { height: 460px; }
      .card1 { width: 45%; }
      .card2 { width: 55%; }
      .cover-title { font-size: 36px; letter-spacing: 2px; }
      .card2-message-text { font-size: 14px; }
      .card2 .card2-recipient { font-size: 26px; }
      .signature { font-size: 18px; }
    }

    /* ══════════════════════════════════════════════════════════════════════
       SCENE 2  LOVE LETTER
    ══════════════════════════════════════════════════════════════════════ */
    #s2 {
      background: #8b0000;
    }
    #s2 .heart-container {
      position: absolute;
      animation: heartbeat 3s infinite;
      transform-origin: center;
      z-index: 1;
    }
    .heart-container.left  { top: 20%; left: 24px; }
    .heart-container.right { bottom: 10%; right: 24px; transform: rotate(180deg); }
    @media (min-width: 768px) {
      .heart-container.left  { left: 80px; }
      .heart-container.right { right: 80px; }
    }
    .heart-container svg { width: 110px; height: 200px; }
    @media (min-width: 768px) { .heart-container svg { width: 150px; } }
    @keyframes heartbeat {
      0%,100% { transform: scale(1); }
      25% { transform: scale(1.1); }
      50% { transform: scale(0.95); }
      75% { transform: scale(1.1); }
    }
    .heart-container.right { animation-name: heartbeatR; }
    @keyframes heartbeatR {
      0%,100% { transform: scale(1) rotate(180deg); }
      25% { transform: scale(1.1) rotate(180deg); }
      50% { transform: scale(0.95) rotate(180deg); }
      75% { transform: scale(1.1) rotate(180deg); }
    }

    .cssletter {
      position: relative;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      user-select: none;
      overflow: hidden;
      z-index: 10;
    }
    .envelope {
      position: relative;
      width: 300px; height: 200px;
      background: Moccasin;
    }
    @media (min-width: 650px) {
      .envelope { width: 600px; height: 400px; }
    }
    .envelope::before {
      content: "˚ʚ❤︎ɞ˚";
      font-size: 50px;
      color: #fff;
      position: absolute;
      left: 50%; top: 20%;
      transform: translate(-50%, -50%);
      mix-blend-mode: soft-light;
    }
    @media (min-width: 650px) {
      .envelope::before { font-size: 5rem; top: 30%; }
    }
    .envelope-flap {
      width: 100%; height: 71%;
      position: absolute; top: 0;
      z-index: 3;
      overflow: hidden;
      transition: 0.6s linear all;
      transform-origin: top;
      pointer-events: all;
    }
    .envelope-folds {
      width: 100%; height: 100%;
      overflow: hidden;
      z-index: 2;
      position: absolute;
      inset: 0;
    }
    .envelope-flap::before,
    .envelope-left::before,
    .envelope-right::before,
    .envelope-bottom::before {
      content: '';
      transform: rotate(45deg);
      background: Moccasin;
      box-shadow: 0 0 30px -5px Peru;
      width: 100%;
      aspect-ratio: 1;
      display: block;
      position: absolute;
      top: 60%;
    }
    .envelope-flap::before {
      border-radius: 5rem; bottom: 30px; top: auto;
    }
    @media (min-width: 650px) { .envelope-flap::before { bottom: 100px; } }
    .envelope-left  { position: absolute; inset: 0; }
    .envelope-right { position: absolute; inset: 0; }
    .envelope-bottom{ position: absolute; inset: 0; }
    .envelope-left::before  { top: 10%; left: -65%; }
    .envelope-right::before { top: 10%; right: -65%; }
    .envelope-bottom::before{ top: 60%; border-radius: 5rem; }

    .env-heart {
      z-index: 4;
      position: relative;
      border: none;
      width: 70px; aspect-ratio: 1;
      background:
        radial-gradient(circle at 60% 65%, #8b0000 64%, transparent 65%) top left/50% 50%,
        radial-gradient(circle at 40% 65%, #8b0000 64%, transparent 65%) top right/50% 50%,
        conic-gradient(from -45deg at 50% 85.5%, #8b0000 90deg, transparent 0) bottom/100% 50%;
      background-repeat: no-repeat;
      left: 50%; top: 70%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      outline: none;
    }
    @media (min-width: 650px) { .env-heart { width: 150px; } }
    .env-heart::before {
      content: '';
      display: block;
      position: absolute;
      width: 70px; aspect-ratio: 1;
      background:
        radial-gradient(circle at 60% 65%, rgba(255,255,255,.15) 64%, transparent 65%) top left/50% 50%,
        radial-gradient(circle at 40% 65%, rgba(255,255,255,.15) 64%, transparent 65%) top right/50% 50%,
        conic-gradient(from -45deg at 50% 85.5%, rgba(255,255,255,.15) 90deg, transparent 0) bottom/100% 50%;
      background-repeat: no-repeat;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0);
      transition: 0.3s ease all;
      z-index: -1;
    }
    @media (min-width: 650px) { .env-heart::before { width: 150px; } }
    .env-heart:hover::before { transform: translate(-50%, -50%) scale(0.8); }
    .heart-text {
      display: block;
      color: #fff;
      font-size: 1.5rem;
      font-family: 'Sriracha', cursive;
      transform: translateY(-10px);
    }
    .envelope.active * { pointer-events: none; }
    .envelope.active .envelope-flap {
      transform: rotateX(-180deg) translateY(0);
      perspective: 10px;
    }
    .envelope.active .envelope-flap::before { box-shadow: inset 0 0 30px -5px Peru; }
    .envelope.active .env-heart { display: none; }

    .letters {
      position: absolute; inset: 0;
      z-index: 5;
      pointer-events: none;
    }
    .letter {
      box-sizing: border-box;
      font-family: 'Sriracha', cursive;
      font-size: 1rem;
      line-height: 1.15;
      background: AntiqueWhite;
      color: #180d07;
      width: 250px;
      height: calc(250px - 1rem - 10px);
      box-shadow: inset 0 0 20px -5px BurlyWood;
      padding: 3rem 1rem 1rem;
      margin: 0;
      cursor: grab;
      position: absolute;
      overflow: auto;
      text-align: center;
      border: 0;
      opacity: 0;
      pointer-events: auto;
      transition: opacity 0.5s;
    }
    .letter.show { opacity: 1; }
    @media (min-width: 650px) {
      .letter { width: 500px; height: calc(400px - 1rem - 10px); font-size: 1.3rem; }
    }
    .letter:active { cursor: grabbing; }
    .letter cite {
      display: block;
      font-size: 1.15rem;
      margin-top: 1rem;
      font-style: normal;
    }
    .letter cite::before { content: none; }
    .letter:nth-child(even) { transform: skew(-2deg) translateY(-4px); }
    .letter:nth-child(odd)  { transform: skew(2deg)  translateY(4px); }
    .closeLetter {
      font-size: 0 !important;
      position: absolute;
      top: 0.6rem; left: 50%;
      transform: translateX(-50%);
      background: none; border: 0;
      padding: 0; cursor: pointer;
    }
    .closeLetter::before {
      content: "˚ʚ❤︎ɞ˚";
      font-size: 1.5rem !important;
      font-family: 'Sriracha', cursive;
      color: darkred;
    }
    .closeLetter:hover::before { content: "xXx"; }

    /* Snowflakes/hearts */
    .snowflakes {
      position: absolute; inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .snowflake {
      position: absolute;
      top: -10%;
      animation: snowflakes-fall 10s linear infinite, snowflakes-shake 3s ease-in-out infinite;
    }
    .snowflake svg { width: 25px; height: 25px; }
    .snowflake:nth-of-type(1) { left: 10%; animation-delay: 1s, 1s; }
    .snowflake:nth-of-type(2) { left: 20%; animation-delay: 6s, 0.5s; }
    .snowflake:nth-of-type(3) { left: 30%; animation-delay: 4s, 2s; }
    .snowflake:nth-of-type(4) { left: 40%; animation-delay: 2s, 2s; }
    .snowflake:nth-of-type(5) { left: 50%; animation-delay: 8s, 3s; }
    .snowflake:nth-of-type(6) { left: 60%; animation-delay: 6s, 2s; }
    .snowflake:nth-of-type(7) { left: 70%; animation-delay: 2.5s, 1s; }
    .snowflake:nth-of-type(8) { left: 80%; animation-delay: 1s, 0s; }
    .snowflake:nth-of-type(9) { left: 90%; animation-delay: 3s, 1.5s; }
    @keyframes snowflakes-fall  { 0%{top:-10%} 100%{top:110%} }
    @keyframes snowflakes-shake { 0%,100%{transform:translateX(0)} 50%{transform:translateX(60px)} }

    /* Back button (scene 2 → 1) */
    #back-home {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 20;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      padding: 8px 14px;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Sriracha', cursive;
      font-size: 0.95rem;
    }
    #back-home:hover { background: rgba(255,255,255,0.25); }

    #confetti-canvas {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 99999;
    }
  </style>
</head>

            <span style="font-family:'Dancing Script',cursive;font-size:1.5rem;">Dear <span data-node-name="recipientName">Trisha</span></span>
          </div>
        </div>
        <div class="envelope-folds">
          <div class="envelope-left"></div>
          <div class="envelope-right"></div>
          <div class="envelope-bottom"></div>
        </div>
      </div>

      <div class="letters" id="letters-container"></div>
    </div>

    <!-- Falling hearts -->
    <div class="snowflakes">
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
      <div class="snowflake"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 21s-7-4.5-9.5-9C.7 8.5 3 4.5 7 4.5c2 0 3.5 1 5 3 1.5-2 3-3 5-3 4 0 6.3 4 4.5 7.5C19 16.5 12 21 12 21z"/></svg></div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>

  <script>
    /* ══════════════════════════════════════════════════════════
       STATE
    ══════════════════════════════════════════════════════════ */
    const STATE = {
      current: 0,
      transitioning: false,
      recipientName: 'Trisha',
      senderName: 'Rexon',
      dobText: '19 Nov',
      letters: [],
      zIndexCounter: 10,
      envelopeOpen: false,
    };
    const SCENES = ['s1', 's2'];

    /* ══════════════════════════════════════════════════════════
       SCENE TRANSITIONS
    ══════════════════════════════════════════════════════════ */
    function goScene(idx) {
      if (idx < 0 || idx >= SCENES.length || idx === STATE.current) return;
      if (STATE.transitioning) return;
      STATE.transitioning = true;

      const fromEl = document.getElementById(SCENES[STATE.current]);
      const toEl   = document.getElementById(SCENES[idx]);
      toEl.classList.add('active');
      setTimeout(() => {
        fromEl.classList.remove('active');
        STATE.current = idx;
        STATE.transitioning = false;
      }, 500);
    }

    /* ══════════════════════════════════════════════════════════
       INIT SCENE 1  (letter-by-letter title + spinning circle text)
    ══════════════════════════════════════════════════════════ */
    function buildTitle() {
      const happy = document.getElementById('happy-word');
      const bday  = document.getElementById('birthday-word');
      happy.innerHTML = ''; bday.innerHTML = '';
      const H = 'Happy';
      const B = 'Birthday';
      H.split('').forEach((ch, i) => {
        const s = document.createElement('span');
        s.textContent = ch;
        s.style.setProperty('--t', (4 + i * 0.2) + 's');
        happy.appendChild(s);
      });
      B.split('').forEach((ch, i) => {
        const s = document.createElement('span');
        s.textContent = ch;
        s.style.setProperty('--t', (5 + i * 0.2) + 's');
        bday.appendChild(s);
      });
    }

    function buildTextCircle() {
      const wrap = document.getElementById('text-circle');
      wrap.innerHTML = '';
      const chars = 'happy-birthday-'.split('');
      chars.forEach((ch, i) => {
        const s = document.createElement('span');
        s.textContent = ch;
        s.style.setProperty('--i', (i + 1));
        wrap.appendChild(s);
      });
    }

    function typeDOB() {
      const target = document.getElementById('dob-text');
      const text = STATE.dobText;
      let i = 0;
      target.textContent = '';
      const timer = setInterval(() => {
        if (i < text.length) {
          target.textContent += text[i];
          i++;
        } else {
          clearInterval(timer);
        }
      }, 100);
    }

    /* ══════════════════════════════════════════════════════════
       BOOK MODAL
    ══════════════════════════════════════════════════════════ */
    function openBook()  { document.getElementById('boxMail').classList.add('open'); }
    function closeBook() { document.getElementById('boxMail').classList.remove('open'); }

    /* ══════════════════════════════════════════════════════════
       LOVE LETTER SCENE
    ══════════════════════════════════════════════════════════ */
    function openEnvelope() {
      if (STATE.envelopeOpen) return;
      STATE.envelopeOpen = true;
      document.getElementById('envelope').classList.add('active');
      setTimeout(() => renderLetters(), 700);
    }

    function renderLetters() {
      const container = document.getElementById('letters-container');
      container.innerHTML = '';

      const w = window.innerWidth;
      const h = window.innerHeight;
      const isMobile = w < 650;
      const letterW = isMobile ? 250 : 500;
      const letterH = isMobile ? 235 : 385;

      STATE.letters.forEach((letter, i) => {
        const el = document.createElement('blockquote');
        el.className = 'letter';
        el.dataset.id = letter.id;
        el.style.zIndex = 10 + i;
        const staggerX = (Math.random() - 0.5) * Math.min(220, w * 0.3);
        const staggerY = (Math.random() - 0.5) * Math.min(180, h * 0.3);
        const cx = Math.max(10, Math.min(w - letterW - 10, w / 2 - letterW / 2 + staggerX));
        const cy = Math.max(60, Math.min(h - letterH - 30, h / 2 - letterH / 2 + staggerY));
        el.style.left = cx + 'px';
        el.style.top  = cy + 'px';

        const closeBtn = document.createElement('button');
        closeBtn.className = 'closeLetter';
        closeBtn.title = 'Close';
        closeBtn.onclick = (e) => {
          e.stopPropagation();
          el.remove();
          STATE.letters = STATE.letters.filter(l => l.id !== letter.id);
        };
        el.appendChild(closeBtn);

        const p = document.createElement('p');
        p.textContent = letter.msg;
        el.appendChild(p);

        const cite = document.createElement('cite');
        cite.textContent = letter.name;
        el.appendChild(cite);

        el.addEventListener('mousedown', onLetterDragStart);
        el.addEventListener('touchstart', onLetterDragStart, { passive: false });
        container.appendChild(el);

        // Stagger fade in
        setTimeout(() => el.classList.add('show'), 60 + i * 90);
      });
    }

    function onLetterDragStart(e) {
      const isTouch = e.type === 'touchstart';
      const start   = isTouch ? e.touches[0] : e;
      if (start.target.tagName === 'BUTTON') return;
      if (isTouch) e.preventDefault();

      const el = e.currentTarget;
      const rect = el.getBoundingClientRect();
      const offX = start.clientX - rect.left;
      const offY = start.clientY - rect.top;

      el.style.transform = 'none';
      el.style.zIndex = ++STATE.zIndexCounter;

      const move = (ev) => {
        const p = isTouch ? ev.touches[0] : ev;
        el.style.left = (p.clientX - offX) + 'px';
        el.style.top  = (p.clientY - offY) + 'px';
      };
      const up = () => {
        document.removeEventListener(isTouch ? 'touchmove' : 'mousemove', move);
        document.removeEventListener(isTouch ? 'touchend'  : 'mouseup',   up);
      };
      document.addEventListener(isTouch ? 'touchmove' : 'mousemove', move, isTouch ? {passive:false} : undefined);
      document.addEventListener(isTouch ? 'touchend'  : 'mouseup',   up);
    }

    /* ══════════════════════════════════════════════════════════
       CONFETTI  (minimal, canvas-based, no dep)
    ══════════════════════════════════════════════════════════ */
    function fireConfetti() {
      const cvs = document.getElementById('confetti-canvas');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth;
      cvs.height = window.innerHeight;
      const colors = ['#bb0000', '#ffffff', '#FF7882', '#FFD84D'];
      const parts = [];
      const N = 140;
      for (let i = 0; i < N; i++) {
        parts.push({
          x: (Math.random() < 0.5 ? 0 : cvs.width) + (Math.random() - 0.5) * 40,
          y: cvs.height * (0.3 + Math.random() * 0.4),
          vx: (Math.random() - 0.5) * 14 + (i % 2 === 0 ? 6 : -6),
          vy: -Math.random() * 12 - 4,
          g: 0.35,
          color: colors[(Math.random() * colors.length) | 0],
          size: 3 + Math.random() * 3,
          life: 100,
        });
      }
      let frames = 0;
      function loop() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        parts.forEach(p => {
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.life--;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        frames++;
        if (frames < 160) requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
      loop();
    }

    /* ══════════════════════════════════════════════════════════
       DATA WIRING
    ══════════════════════════════════════════════════════════ */
    function collectLetters(data) {
      const out = [];
      for (let i = 1; i <= 8; i++) {
        const msg  = data[`letter${i}Text`];
        const name = data[`letter${i}Sender`] || data.senderName || STATE.senderName;
        if (msg && msg.trim()) out.push({ id: i, name, msg });
      }
      return out;
    }

    function collectBookParagraphs(data) {
      const el = document.getElementById('book-message');
      el.innerHTML = '';
      for (let i = 1; i <= 4; i++) {
        const text = data[`bookP${i}`];
        if (!text) continue;
        const art = document.createElement('article');
        art.textContent = text;
        el.appendChild(art);
      }
      if (!el.children.length) {
        const art = document.createElement('article');
        art.textContent = 'Happy Birthday !';
        el.appendChild(art);
      }
    }

    function applyField(key, val) {
      if (val == null || val === '') return;

      if (key === 'recipientName') {
        STATE.recipientName = val;
        document.querySelectorAll('[data-node-name="recipientName"]').forEach(el => el.textContent = val);
        return;
      }
      if (key === 'senderName') {
        STATE.senderName = val;
        document.querySelectorAll('[data-node-name="senderName"]').forEach(el => el.textContent = val);
        return;
      }
      if (key === 'dateOfBirth') { STATE.dobText = val; return; }
      if (key === 'photoSrc') {
        const p1 = document.getElementById('portrait');
        const p2 = document.getElementById('portraitBook');
        if (p1) { p1.src = val; p1.style.display = 'block'; }
        if (p2) { p2.src = val; p2.style.display = 'block'; }
        return;
      }
      const el = document.querySelector(`[data-node-name="${key}"]`);
      if (el) el.textContent = val;
    }

    function renderAll(data) {
      if (!data) return;
      Object.keys(data).forEach(k => applyField(k, data[k]));
      STATE.letters = collectLetters(data);
      collectBookParagraphs(data);
    }

    /* ══════════════════════════════════════════════════════════
       INIT
    ══════════════════════════════════════════════════════════ */
    function initHome() {
      buildTitle();
      buildTextCircle();
      typeDOB();
    }

    function init() {
      // Load data
      const data = window.__WW_DATA__ || {};
      renderAll(data);

      // Show home scene (bottom layer)
      document.getElementById('s1').classList.add('active');

      initHome();

      // Fallback: default letters if none seeded
      if (!STATE.letters.length) {
        STATE.letters = [
          { id: 1, name: STATE.senderName, msg: 'Wish you the happiest birthday.' },
          { id: 2, name: STATE.senderName, msg: 'One picture from you can change my whole day, my whole mood, my whole heartbeat.' },
          { id: 3, name: STATE.senderName, msg: "Even through screens and pixels, your laugh reaches me like sunlight through a window — warm, real, and impossible to forget." },
          { id: 4, name: STATE.senderName, msg: "Every notification from you feels like a heartbeat whispering, I'm here." },
          { id: 5, name: STATE.senderName, msg: "Our messages might travel through wires, but every word you send lands straight in my heart." },
        ];
      }

      // Loader out after cake animation completes (~9s)
      setTimeout(() => fireConfetti(), 6800);
      setTimeout(() => {
        document.getElementById('loader').classList.add('out');
      }, 8600);
    }

    window.addEventListener('message', (e) => {
      if (!e.data || e.data.type !== 'WW_UPDATE') return;
      const { data, style } = e.data;
      if (style) {
        const r = document.documentElement;
        if (style.primaryColor) r.style.setProperty('--primary', style.primaryColor);
        if (style.accentColor)  r.style.setProperty('--accent',  style.accentColor);
      }
      if (data) {
        renderAll(data);
        initHome();
      }
    });

    init();
  </script>
</body>
